name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nova tag que deve coincidir com Directory.Build.props, por exemplo v1.0.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Preparar release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar versão solicitada
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = $props.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw 'A tag deve coincidir com a versão declarada em Directory.Build.props.'
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Validar e criar os arquivos
        shell: pwsh
        run: ./scripts/Empacotar.ps1 -DiretorioSaida ./artifacts/distribuicao
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            artifacts/distribuicao/*.vsix
            artifacts/distribuicao/*.zip
            artifacts/distribuicao/SHA256SUMS.txt
            artifacts/distribuicao/release-info.json
          if-no-files-found: error
          retention-days: 30
      - name: Guardar relatórios de testes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
  publish:
    name: Publicar no GitHub
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: artifacts/distribuicao
      - name: Publicar arquivos validados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./scripts/PublicarRelease.ps1 -Tag $env:RELEASE_TAG -DiretorioPacote ./artifacts/distribuicao -Commit $env:GITHUB_SHA
